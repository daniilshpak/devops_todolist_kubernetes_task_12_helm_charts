namespace: mysql

secrets:
  MYSQL_ROOT_PASSWORD: "MTIzNA==" # Base64 encoding for "1234"
  MYSQL_USER: "YXBwX3VzZXI=" # Base64 encoding for "app_user"
  MYSQL_PASSWORD: "MTIzNA==" # Base64 encoding for "1234"

replicas: 2

image:
  repository: mysql
  tag: "8.0"

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 3Gi

pvc:
  resources:
    requests:
      storage: 2Gi

tolerations:
  key: "app"
  operator: "Equal"
  value: "mysql"
  effect: "NoSchedule"

affinity:
  podAntiAffinity:
    key: app
    operator: In
    values:
      - mysql
    topologyKey: kubernetes.io/hostname
  nodeAffinity:
    key: app
    operator: In
    values:
      - mysql